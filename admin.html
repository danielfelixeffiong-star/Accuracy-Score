<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accuracy Score - Master Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #fff; padding: 20px; }
        .card { background: #151f32; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #223049; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input, select, textarea { background: #0f172a; color: #fff; border: 1px solid #334155; }
        button { background: #38bdf8; color: #0b0f19; cursor: pointer; font-weight: bold; font-size: 15px; text-transform: uppercase; }
        .item { background: #1e293b; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .s-btn { padding: 6px; font-size: 11px; font-weight: bold; border-radius: 4px; color: #fff; }
    </style>
</head>
<body>

    <h1>Accuracy Score Manager</h1>

    <!-- SECTION 1: FREE TIPS -->
    <div class="card">
        <h2>🆓 Post Free Match</h2>
        <input type="date" id="fDate">
        <input type="text" id="fLeague" placeholder="League">
        <input type="text" id="fTime" placeholder="Kickoff Time">
        <input type="text" id="fTeam1" placeholder="Home Team">
        <input type="text" id="fTeam2" placeholder="Away Team">
        <input type="text" id="fPred" placeholder="Prediction">
        <input type="number" step="0.01" id="fOdds" placeholder="Odds">
        <textarea id="fAnly" placeholder="Analysis Notes"></textarea>
        <button type="button" onclick="submitFree()">Publish Free Match</button>
    </div>

    <div class="card">
        <h2>⏳ Manage Free Match Status</h2>
        <div id="freeList">Loading live feed...</div>
    </div>

    <!-- SECTION 2: VIP ZONES -->
    <div class="card">
        <h2>👑 Post VIP Ticket Match</h2>
        <input type="text" id="vLeague" placeholder="League">
        <input type="text" id="vTime" placeholder="Kickoff Time">
        <input type="text" id="vTeam1" placeholder="Home Team">
        <input type="text" id="vTeam2" placeholder="Away Team">
        <input type="text" id="vPred" placeholder="Correct Score Prediction">
        <input type="number" step="0.01" id="vOdds" placeholder="Odds">
        <button type="button" onclick="submitVip()">Add to Active VIP Ticket</button>
    </div>

    <div class="card" style="background:#131224;">
        <h2>⚡ Active VIP Ticket</h2>
        <input type="number" step="0.01" id="vTotal" placeholder="Total Combined Ticket Odds">
        <button type="button" style="background:#22c55e; color:#fff; margin-bottom:10px;" onclick="closeVipTicket('WON')">🏆 Archive Ticket as WON</button>
        <button type="button" style="background:#ef4444; color:#fff;" onclick="closeVipTicket('LOST')">❌ Archive Ticket as LOST</button>
        <div id="vipList">No matches in active ticket.</div>
    </div>

    <!-- SECTION 3: SYSTEM NOTICES -->
    <div class="card">
        <h2>📅 Update VIP Notice Date</h2>
        <input type="date" id="bannerDate">
        <button type="button" onclick="submitBanner()">Update Notice Date</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, updateDoc, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://gstatic.com";

        const firebaseConfig = {
          apiKey: "AIzaSyAFFzyLlX_XUtFcw9i1YDY0L18QjRNMLA5Q",
          authDomain: "://firebaseapp.com",
          projectId: "accuracy-score-9fafd",
          storageBucket: "accuracy-score-9fafd.firebasestorage.app",
          messagingSenderId: "1003404537815",
          appId: "1:1003404537815:web:8cb1dc67c77f8043f00592"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Submit Free Tip Data
        window.submitFree = async function() {
            const date = document.getElementById('fDate').value;
            const league = document.getElementById('fLeague').value;
            const time = document.getElementById('fTime').value;
            const team1 = document.getElementById('fTeam1').value;
            const team2 = document.getElementById('fTeam2').value;
            const pred = document.getElementById('fPred').value;
            const odds = document.getElementById('fOdds').value;
            const anly = document.getElementById('fAnly').value;

            if(!date || !team1 || !team2 || !pred || !odds) return alert("Fill required inputs!");

            try {
                await addDoc(collection(db, "free_tips"), {
                    matchDate: date, league, time, team1, team2, prediction: pred,
                    odds: parseFloat(odds), analytics: anly || "Analyze carefully.",
                    status: "NOT STARTED", timestamp: Date.now()
                });
                alert("Free match added successfully!");
                document.getElementById('fTeam1').value = '';
                document.getElementById('fTeam2').value = '';
                document.getElementById('fPred').value = '';
                document.getElementById('fOdds').value = '';
            } catch(e) { alert("Error: " + e.message); }
        };

        // Stream Free Matches
        onSnapshot(collection(db, "free_tips"), (snap) => {
            const box = document.getElementById('freeList');
            box.innerHTML = '';
            snap.forEach(itemDoc => {
                const data = itemDoc.data();
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <strong>${data.team1} vs ${data.team2}</strong> [${data.status}]<br>
                    <div class="grid">
                        <button class="s-btn" style="background:#22c55e" onclick="setFreeStatus('${itemDoc.id}','WON')">WON</button>
                        <button class="s-btn" style="background:#ef4444" onclick="setFreeStatus('${itemDoc.id}','LOST')">LOST</button>
                        <button class="s-btn" style="background:#64748b" onclick="setFreeStatus('${itemDoc.id}','VOID')">VOID</button>
                    </div>
                `;
                box.appendChild(div);
            });
        });

        window.setFreeStatus = async function(id, status) {
            await updateDoc(doc(db, "free_tips", id), { status });
        };

        // Submit VIP Data
        window.submitVip = async function() {
            const league = document.getElementById('vLeague').value;
            const time = document.getElementById('vTime').value;
            const team1 = document.getElementById('vTeam1').value;
            const team2 = document.getElementById('vTeam2').value;
            const pred = document.getElementById('vPred').value;
            const odds = document.getElementById('vOdds').value;

            if(!team1 || !team2 || !pred || !odds) return alert("Fill required fields!");

            try {
                await addDoc(collection(db, "vip_active"), {
                    league, time, team1, team2, prediction: pred, odds: parseFloat(odds)
                });
                alert("Match added to VIP ticket!");
                document.getElementById('vTeam1').value = '';
                document.getElementById('vTeam2').value = '';
                document.getElementById('vPred').value = '';
                document.getElementById('vOdds').value = '';
            } catch(e) { alert("Error: " + e.message); }
        };

        // Stream Active VIP
        onSnapshot(collection(db, "vip_active"), (snap) => {
            const box = document.getElementById('vipList');
            box.innerHTML = '';
            snap.forEach(itemDoc => {
                const data = itemDoc.data();
                const div = document.createElement('div');
                div.className = 'item';
                div.style.borderLeftColor = '#ffc107';
                div.innerHTML = `<strong>${data.team1} vs ${data.team2}</strong> - CS: ${data.prediction}`;
                box.appendChild(div);
            });
        });

        // Settle Ticket Data
        window.closeVipTicket = async function(outcome) {
            const total = document.getElementById('vTotal').value;
            if(!total) return alert("Enter total odds calculation!");

            const snap = await getDocs(collection(db, "vip_active"));
            if(snap.empty) return alert("No active games found.");

            let matches = [];
            snap.forEach(d => {
                let mData = d.data();
                mData.status = outcome;
                matches.push(mData);
            });

            await addDoc(collection(db, "vip_results"), {
                ticketOutcome: outcome,
                totalOdds: parseFloat(total),
                timestamp: Date.now(),
                matches: matches
            });

            for (let d of snap.docs) {
                await deleteDoc(doc(db, "vip_active", d.id));
            }
            alert("Ticket closed and moved to Correct Score Results!");
            document.getElementById('vTotal').value = '';
        };

        // Update Notice Date
        window.submitBanner = async function() {
            const date = document.getElementById('bannerDate').value;
            if(!date) return alert("Select a date!");
            await setDoc(doc(db, "metadata", "vip_notice"), { next_ticket_date: date });
            alert("VIP announcement notice calendar field updated!");
        };
    </script>
</body>
</html>
